<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" font-family="'SF Mono','Fira Code','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="brokerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2d3a"/>
      <stop offset="100%" stop-color="#12202c"/>
    </linearGradient>
    <linearGradient id="idaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="100%" stop-color="#1a0f28"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#0f1f0f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
    </marker>
    <marker id="arrowR2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#da70d6" stroke-width="1.2"/>
    </marker>
    <marker id="arrowL2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#da70d6" stroke-width="1.2"/>
    </marker>
    <marker id="arrowSSE" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#f0883e" stroke-width="1.2"/>
    </marker>
    <marker id="arrowSSER" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#f0883e" stroke-width="1.2"/>
    </marker>
    <marker id="arrowSSH" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#7ee787" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="520" rx="12" fill="url(#bg)"/>

  <!-- Local Machine region -->
  <rect x="20" y="16" width="720" height="488" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="36" y="38" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="0.5">LOCAL MACHINE</text>

  <!-- Remote Machine region -->
  <rect x="800" y="16" width="240" height="488" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="836" y="38" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="0.5">REMOTE (optional)</text>

  <!-- ==================== CURSOR WINDOWS ==================== -->
  <!-- Cursor Win A -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="170" height="56" rx="6" fill="url(#cursorGrad)" stroke="#3fb950" stroke-width="1.2"/>
    <text x="125" y="94" fill="#3fb950" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5">MCP CLIENT</text>
    <text x="125" y="112" fill="#e6edf3" text-anchor="middle" font-weight="500">Cursor Win A</text>
  </g>

  <!-- Cursor Win B -->
  <g filter="url(#shadow)">
    <rect x="40" y="170" width="170" height="56" rx="6" fill="url(#cursorGrad)" stroke="#3fb950" stroke-width="1.2"/>
    <text x="125" y="194" fill="#3fb950" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5">MCP CLIENT</text>
    <text x="125" y="212" fill="#e6edf3" text-anchor="middle" font-weight="500">Cursor Win B</text>
  </g>

  <!-- ==================== MCP PROCESSES ==================== -->
  <!-- MCP Process A -->
  <g filter="url(#shadow)">
    <rect x="320" y="70" width="180" height="56" rx="6" fill="url(#mcpGrad)" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="410" y="94" fill="#58a6ff" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5">STDIO PROXY</text>
    <text x="410" y="112" fill="#e6edf3" text-anchor="middle" font-weight="500">MCP Process A</text>
  </g>

  <!-- MCP Process B -->
  <g filter="url(#shadow)">
    <rect x="320" y="170" width="180" height="56" rx="6" fill="url(#mcpGrad)" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="410" y="194" fill="#58a6ff" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5">STDIO PROXY</text>
    <text x="410" y="212" fill="#e6edf3" text-anchor="middle" font-weight="500">MCP Process B</text>
  </g>

  <!-- ==================== BROKER ==================== -->
  <g filter="url(#shadow)">
    <rect x="570" y="60" width="160" height="186" rx="8" fill="url(#brokerGrad)" stroke="#f0883e" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="570" y="60" width="160" height="30" rx="8" fill="#f0883e" opacity="0.15"/>
    <text x="650" y="80" fill="#f0883e" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5">BROKER</text>
    <!-- Port badge -->
    <rect x="600" y="92" width="100" height="20" rx="10" fill="#f0883e" opacity="0.12"/>
    <text x="650" y="106" fill="#f0883e" text-anchor="middle" font-size="11">:13337</text>
    <!-- Registry section -->
    <line x1="582" y1="125" x2="718" y2="125" stroke="#30363d" stroke-width="1"/>
    <text x="650" y="148" fill="#8b949e" text-anchor="middle" font-size="10" letter-spacing="0.5">REGISTRY</text>
    <!-- Instance entries -->
    <rect x="585" y="158" width="150" height="18" rx="3" fill="#1a2a1a" opacity="0.6"/>
    <circle cx="596" cy="167" r="3" fill="#3fb950"/>
    <text x="604" y="171" fill="#7ee787" font-size="9">ida-12345 (local)</text>
    <rect x="585" y="180" width="150" height="18" rx="3" fill="#2a1a2a" opacity="0.6"/>
    <circle cx="596" cy="189" r="3" fill="#da70d6"/>
    <text x="604" y="193" fill="#da9af0" font-size="9">ida-67890 (remote)</text>
    <!-- Dashboard hint -->
    <text x="650" y="232" fill="#484f58" text-anchor="middle" font-size="9">http://127.0.0.1:13337</text>
  </g>

  <!-- ==================== IDA INSTANCES ==================== -->
  <!-- IDA (local) -->
  <g filter="url(#shadow)">
    <rect x="40" y="330" width="210" height="82" rx="6" fill="url(#idaGrad)" stroke="#da70d6" stroke-width="1.2"/>
    <text x="145" y="354" fill="#da70d6" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5">IDA PLUGIN</text>
    <text x="145" y="374" fill="#e6edf3" text-anchor="middle" font-weight="500">IDA (local)</text>
    <rect x="60" y="384" width="170" height="18" rx="3" fill="#da70d6" opacity="0.08"/>
    <text x="145" y="397" fill="#8b949e" text-anchor="middle" font-size="9">ida-12345-[127.0.0.1]</text>
  </g>

  <!-- IDA (remote) -->
  <g filter="url(#shadow)">
    <rect x="820" y="330" width="200" height="82" rx="6" fill="url(#idaGrad)" stroke="#da70d6" stroke-width="1.2"/>
    <text x="920" y="354" fill="#da70d6" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5">IDA PLUGIN</text>
    <text x="920" y="374" fill="#e6edf3" text-anchor="middle" font-weight="500">IDA (remote)</text>
    <rect x="836" y="384" width="168" height="18" rx="3" fill="#da70d6" opacity="0.08"/>
    <text x="920" y="397" fill="#8b949e" text-anchor="middle" font-size="9">ida-67890-[192.168.1.100]</text>
  </g>

  <!-- ==================== CONNECTIONS ==================== -->

  <!-- Cursor A ↔ MCP A (stdio) -->
  <line x1="210" y1="93" x2="320" y2="93" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrowR)" marker-start="url(#arrowL)" opacity="0.8"/>
  <rect x="232" y="81" width="44" height="16" rx="3" fill="#0d1117"/>
  <text x="254" y="93" fill="#58a6ff" text-anchor="middle" font-size="9" font-weight="600">stdio</text>

  <!-- Cursor B ↔ MCP B (stdio) -->
  <line x1="210" y1="193" x2="320" y2="193" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrowR)" marker-start="url(#arrowL)" opacity="0.8"/>
  <rect x="232" y="181" width="44" height="16" rx="3" fill="#0d1117"/>
  <text x="254" y="193" fill="#58a6ff" text-anchor="middle" font-size="9" font-weight="600">stdio</text>

  <!-- MCP A → Broker (HTTP) -->
  <line x1="500" y1="98" x2="570" y2="118" stroke="#58a6ff" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowR)" opacity="0.7"/>
  <rect x="513" y="94" width="40" height="16" rx="3" fill="#0d1117"/>
  <text x="533" y="106" fill="#58a6ff" text-anchor="middle" font-size="9" font-weight="600">HTTP</text>

  <!-- MCP B → Broker (HTTP) -->
  <line x1="500" y1="198" x2="570" y2="178" stroke="#58a6ff" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowR)" opacity="0.7"/>
  <rect x="513" y="180" width="40" height="16" rx="3" fill="#0d1117"/>
  <text x="533" y="192" fill="#58a6ff" text-anchor="middle" font-size="9" font-weight="600">HTTP</text>

  <!-- IDA local ↔ Broker (HTTP+SSE) -->
  <path d="M 250 365 C 400 365, 500 300, 620 246" stroke="#f0883e" stroke-width="1.3" fill="none" marker-end="url(#arrowSSER)" opacity="0.8"/>
  <path d="M 620 252 C 500 310, 400 375, 250 375" stroke="#f0883e" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowSSE)" opacity="0.6"/>
  <rect x="380" y="290" width="110" height="16" rx="3" fill="#0d1117"/>
  <text x="435" y="302" fill="#f0883e" text-anchor="middle" font-size="9" font-weight="600">HTTP register + SSE</text>

  <!-- IDA remote ↔ Broker (SSH tunnel) -->
  <path d="M 730 200 L 780 200 C 790 200, 790 371, 820 371" stroke="#7ee787" stroke-width="1.3" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowSSH)" opacity="0.7"/>
  <rect x="755" y="268" width="42" height="42" rx="4" fill="#0d1117" stroke="#7ee787" stroke-width="0.8" opacity="0.6"/>
  <text x="776" y="285" fill="#7ee787" text-anchor="middle" font-size="9" font-weight="600">SSH</text>
  <text x="776" y="299" fill="#7ee787" text-anchor="middle" font-size="8">tunnel</text>
  <!-- Tunnel label -->
  <text x="776" y="322" fill="#484f58" text-anchor="middle" font-size="8">-R 13337</text>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(40, 446)">
    <rect x="0" y="0" width="690" height="48" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <text x="15" y="18" fill="#8b949e" font-size="10" font-weight="600">LEGEND</text>

    <!-- stdio -->
    <line x1="75" y1="14" x2="105" y2="14" stroke="#58a6ff" stroke-width="1.3"/>
    <text x="110" y="18" fill="#58a6ff" font-size="9">stdio (bidirectional)</text>

    <!-- HTTP -->
    <line x1="240" y1="14" x2="270" y2="14" stroke="#58a6ff" stroke-width="1.3" stroke-dasharray="5,3"/>
    <text x="275" y="18" fill="#58a6ff" font-size="9">HTTP request</text>

    <!-- SSE -->
    <line x1="370" y1="14" x2="400" y2="14" stroke="#f0883e" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="405" y="18" fill="#f0883e" font-size="9">SSE events</text>

    <!-- SSH -->
    <line x1="490" y1="14" x2="520" y2="14" stroke="#7ee787" stroke-width="1.3" stroke-dasharray="6,4"/>
    <text x="525" y="18" fill="#7ee787" font-size="9">SSH tunnel</text>

    <!-- instance_id -->
    <text x="15" y="40" fill="#8b949e" font-size="9">Every tool &amp; resource accepts</text>
    <rect x="195" y="30" width="130" height="15" rx="3" fill="#1a2a3a"/>
    <text x="200" y="41" fill="#79c0ff" font-size="9" font-family="'SF Mono',monospace">?instance_id=ida-...</text>
    <text x="335" y="40" fill="#8b949e" font-size="9">to target a specific IDA instance</text>
  </g>
</svg>
